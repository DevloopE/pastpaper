<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AS-Level Past Papers</title>
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --surface-alt: #faf9f6;
    --border: #e5e3dd;
    --text: #1b1b1b;
    --muted: #6b6b6b;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --done: #16a34a;
    --done-soft: #dcfce7;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
  }
  [data-theme="dark"] {
    --bg: #13141a;
    --surface: #1c1d25;
    --surface-alt: #23242e;
    --border: #2e303b;
    --text: #e8e8ea;
    --muted: #8a8b94;
    --accent: #60a5fa;
    --accent-soft: #1e3a5f;
    --done: #4ade80;
    --done-soft: #1a3a25;
    --shadow: 0 1px 2px rgba(0,0,0,.2), 0 4px 14px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header.top {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .top-inner { max-width: 1200px; margin: 0 auto; padding: 14px 20px 0; }
  .title-row { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .subtitle { color: var(--muted); font-size: 12px; }

  .toolbar {
    margin-left: auto;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .toolbar input[type="search"] {
    padding: 6px 10px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--text);
    border-radius: 6px;
    font-size: 13px;
    min-width: 180px;
  }
  .toolbar button {
    padding: 6px 12px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--text);
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .toolbar button:hover { border-color: var(--accent); }
  .hide-done-label {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }
  .hide-done-label input { accent-color: var(--done); cursor: pointer; }

  .tabs {
    display: flex; gap: 2px; margin-top: 12px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .tab {
    padding: 10px 16px;
    border: none; background: none; cursor: pointer;
    color: var(--muted);
    font-size: 14px; font-weight: 500;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    display: flex; gap: 8px; align-items: center;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .count {
    font-size: 11px;
    background: var(--surface-alt);
    color: var(--muted);
    padding: 2px 8px; border-radius: 10px;
    font-variant-numeric: tabular-nums;
    border: 1px solid var(--border);
  }
  .tab.active .count { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

  .filter-bar {
    background: var(--surface-alt);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
  }
  .filter-bar-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; gap: 20px; flex-wrap: wrap;
    align-items: center;
  }
  .filter-group {
    display: flex; align-items: center; gap: 6px;
    flex-wrap: wrap;
  }
  .filter-group-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-weight: 600;
    margin-right: 2px;
  }
  .chip {
    padding: 4px 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 14px;
    font-size: 12px;
    font-family: var(--mono);
    cursor: pointer;
    user-select: none;
    transition: all 0.1s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .chip.all {
    font-family: inherit;
    font-weight: 500;
  }
  .chip.all.active {
    background: var(--surface);
    color: var(--accent);
    border-color: var(--accent);
  }

  main { max-width: 1200px; margin: 0 auto; padding: 20px; }

  .paper-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .paper-head {
    padding: 14px 18px;
    background: var(--surface-alt);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px;
  }
  .paper-code {
    font-family: var(--mono);
    font-size: 16px; font-weight: 600;
    color: var(--accent);
  }
  .paper-label { color: var(--muted); font-size: 13px; }
  .paper-progress {
    margin-left: auto;
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    padding: 2px 10px;
    background: var(--surface);
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead th {
    text-align: center;
    font-weight: 500;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-alt);
  }
  thead th.left { text-align: left; }

  tbody td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    text-align: center;
  }
  tbody td.left { text-align: left; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.year-start td { border-top: 2px solid var(--border); }

  .year-cell { font-weight: 600; min-width: 60px; font-variant-numeric: tabular-nums; }
  .session-cell { color: var(--muted); min-width: 80px; font-size: 12px; }

  .cell-content { display: inline-flex; align-items: center; gap: 6px; }
  .cell-content a {
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 11px;
    font-family: var(--mono);
    text-decoration: none;
    color: var(--text);
    background: var(--surface);
  }
  .cell-content a:hover { border-color: var(--accent); color: var(--accent); }
  .cell-content a.missing {
    color: var(--muted);
    opacity: 0.35;
    pointer-events: none;
    text-decoration: line-through;
  }
  .cell-content input[type="checkbox"] {
    width: 16px; height: 16px;
    accent-color: var(--done);
    cursor: pointer;
    margin-left: 2px;
  }
  tr.done { background: var(--done-soft); }
  tr.done .cell-content { opacity: 0.8; }
  td.empty-cell { color: var(--muted); opacity: 0.3; }

  .empty {
    text-align: center; padding: 60px 20px;
    color: var(--muted);
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 10px;
  }
  .empty code {
    background: var(--surface-alt);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--mono);
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="title-row">
      <div>
        <h1>AS-Level Past Papers</h1>
        <div class="subtitle">Cambridge International (CAIE) · <span id="yearRange">…</span> · <span id="totalProgress">0 / 0</span> completed</div>
      </div>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search (e.g. s23, qp, 12)" autocomplete="off">
        <label class="hide-done-label">
          <input type="checkbox" id="hideDone">
          Hide done
        </label>
        <button id="exportBtn" title="Download progress as JSON">Export</button>
        <button id="importBtn" title="Import progress JSON">Import</button>
        <button id="resetBtn" title="Clear all progress">Reset</button>
        <button id="themeBtn" title="Toggle theme">Theme</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
  <div class="filter-bar">
    <div class="filter-bar-inner">
      <div class="filter-group">
        <span class="filter-group-label">Year</span>
        <div id="yearChips"></div>
      </div>
      <div class="filter-group">
        <span class="filter-group-label">Session</span>
        <div id="sessionChips"></div>
      </div>
      <div class="filter-group">
        <span class="filter-group-label">Variant</span>
        <div id="variantChips"></div>
      </div>
    </div>
  </div>
</header>

<main id="content"></main>

<input type="file" id="fileInput" accept="application/json" style="display:none">

<script src="papers.js"></script>
<script>
(function() {
  const PAPERS = window.PAPERS || [];
  const STORAGE_KEY = "pastpaper-progress-v1";
  const FILTERS_KEY = "pastpaper-filters-v1";
  const THEME_KEY = "pastpaper-theme";

  const SUBJECTS = [
    { key: "math-9709",      name: "Mathematics",      code: "9709" },
    { key: "chemistry-9701", name: "Chemistry",        code: "9701" },
    { key: "physics-9702",   name: "Physics",          code: "9702" },
    { key: "cs-9618",        name: "Computer Science", code: "9618" },
  ];

  const SESSIONS = [
    { key: "s", label: "May/Jun" },
    { key: "w", label: "Oct/Nov" },
    { key: "m", label: "Feb/Mar" },
  ];
  const SESSION_ORDER = { s: 0, w: 1, m: 2 };

  // --- progress storage -----------------------------------------------------
  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
    catch { return {}; }
  }
  function saveProgress(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
  let progress = loadProgress();

  // --- filter state ---------------------------------------------------------
  // empty set = "all"
  let filters = { years: new Set(), sessions: new Set(), variants: new Set() };
  try {
    const saved = JSON.parse(localStorage.getItem(FILTERS_KEY) || "{}");
    filters.years    = new Set(saved.years    || []);
    filters.sessions = new Set(saved.sessions || []);
    filters.variants = new Set(saved.variants || []);
  } catch {}

  function saveFilters() {
    localStorage.setItem(FILTERS_KEY, JSON.stringify({
      years:    [...filters.years],
      sessions: [...filters.sessions],
      variants: [...filters.variants],
    }));
  }

  // --- theme ----------------------------------------------------------------
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    localStorage.setItem(THEME_KEY, t);
  }
  applyTheme(localStorage.getItem(THEME_KEY) || "light");
  document.getElementById("themeBtn").onclick = () => {
    applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  };

  // --- dataset introspection ------------------------------------------------
  const allYears = [...new Set(PAPERS.map(p => p.year))].sort((a, b) => b - a);
  const yearRangeEl = document.getElementById("yearRange");
  if (allYears.length) yearRangeEl.textContent = `${allYears[allYears.length - 1]}-${allYears[0]}`;

  // --- group: subject -> paper -> year -> session -> variant -> {qp, ms} --
  function group() {
    const out = {};
    for (const s of SUBJECTS) out[s.key] = {};
    for (const p of PAPERS) {
      const by = out[p.subject];
      if (!by) continue;
      (by[p.paper] ??= { label: p.paperLabel, paperDigit: Math.floor(p.variant / 10), years: {} });
      (by[p.paper].years[p.year] ??= {});
      (by[p.paper].years[p.year][p.session] ??= { label: p.sessionLabel, variants: {} });
      (by[p.paper].years[p.year][p.session].variants[p.variant] ??= {});
      by[p.paper].years[p.year][p.session].variants[p.variant][p.type] = p.file;
    }
    return out;
  }
  const GROUPED = group();

  // --- matches filters? -----------------------------------------------------
  function passesFilter(year, session, variant) {
    if (filters.years.size    && !filters.years.has(year))       return false;
    if (filters.sessions.size && !filters.sessions.has(session)) return false;
    const suffix = variant % 10;
    if (filters.variants.size && !filters.variants.has(suffix)) return false;
    return true;
  }

  // --- progress counters (respect filters) ----------------------------------
  function countSubject(subj) {
    let done = 0, total = 0;
    for (const p of PAPERS) {
      if (p.subject !== subj || p.type !== "qp") continue;
      if (!passesFilter(p.year, p.session, p.variant)) continue;
      total++;
      if (progress[p.file]) done++;
    }
    return { done, total };
  }
  function countAll() {
    let done = 0, total = 0;
    for (const p of PAPERS) {
      if (p.type !== "qp") continue;
      if (!passesFilter(p.year, p.session, p.variant)) continue;
      total++;
      if (progress[p.file]) done++;
    }
    return { done, total };
  }

  // --- render filter chips --------------------------------------------------
  function renderChips() {
    const yc = document.getElementById("yearChips");
    const sc = document.getElementById("sessionChips");
    const vc = document.getElementById("variantChips");
    yc.innerHTML = "";
    sc.innerHTML = "";
    vc.innerHTML = "";

    const mkChip = (label, isActive, onClick, isAll = false) => {
      const c = document.createElement("button");
      c.className = "chip" + (isActive ? " active" : "") + (isAll ? " all" : "");
      c.textContent = label;
      c.onclick = onClick;
      return c;
    };

    yc.appendChild(mkChip("All", filters.years.size === 0, () => {
      filters.years.clear(); saveFilters(); renderChips(); renderTabs(); renderContent();
    }, true));
    for (const y of allYears) {
      yc.appendChild(mkChip(String(y), filters.years.has(y), () => {
        if (filters.years.has(y)) filters.years.delete(y); else filters.years.add(y);
        saveFilters(); renderChips(); renderTabs(); renderContent();
      }));
    }

    sc.appendChild(mkChip("All", filters.sessions.size === 0, () => {
      filters.sessions.clear(); saveFilters(); renderChips(); renderTabs(); renderContent();
    }, true));
    for (const s of SESSIONS) {
      sc.appendChild(mkChip(s.label, filters.sessions.has(s.key), () => {
        if (filters.sessions.has(s.key)) filters.sessions.delete(s.key); else filters.sessions.add(s.key);
        saveFilters(); renderChips(); renderTabs(); renderContent();
      }));
    }

    vc.appendChild(mkChip("All", filters.variants.size === 0, () => {
      filters.variants.clear(); saveFilters(); renderChips(); renderTabs(); renderContent();
    }, true));
    for (const v of [1, 2, 3]) {
      vc.appendChild(mkChip("/X" + v, filters.variants.has(v), () => {
        if (filters.variants.has(v)) filters.variants.delete(v); else filters.variants.add(v);
        saveFilters(); renderChips(); renderTabs(); renderContent();
      }));
    }
  }

  // --- render subject tabs --------------------------------------------------
  const tabsEl = document.getElementById("tabs");
  const contentEl = document.getElementById("content");
  let activeSubject = SUBJECTS[0].key;

  function renderTabs() {
    tabsEl.innerHTML = "";
    for (const s of SUBJECTS) {
      const { done, total } = countSubject(s.key);
      const btn = document.createElement("button");
      btn.className = "tab" + (s.key === activeSubject ? " active" : "");
      btn.innerHTML = `${s.name} <span class="count">${done}/${total}</span>`;
      btn.onclick = () => { activeSubject = s.key; renderTabs(); renderContent(); };
      tabsEl.appendChild(btn);
    }
    const all = countAll();
    document.getElementById("totalProgress").textContent = `${all.done} / ${all.total}`;
  }

  // --- render content: paper-first, year matrix ----------------------------
  function renderContent() {
    const subject = SUBJECTS.find(s => s.key === activeSubject);
    const data = GROUPED[activeSubject];
    const paperCodes = Object.keys(data).sort();

    if (!paperCodes.length) {
      contentEl.innerHTML = `
        <div class="empty">
          No papers found for <strong>${subject.name}</strong>.<br>
          Run <code>python download.py</code> in this folder, then refresh.
        </div>`;
      return;
    }

    const hideDone = document.getElementById("hideDone").checked;
    const searchQ = document.getElementById("search").value.trim().toLowerCase();

    const out = [];
    let anyPaperShown = false;

    for (const paperCode of paperCodes) {
      const paper = data[paperCode];
      const pd = paper.paperDigit;
      const columns = [pd * 10 + 1, pd * 10 + 2, pd * 10 + 3];

      const years = Object.keys(paper.years).map(Number).sort((a, b) => b - a);

      // Build rows (year + session combos)
      const rows = [];
      let paperDone = 0, paperTotal = 0;

      for (const year of years) {
        const ySessions = Object.keys(paper.years[year])
          .sort((a, b) => SESSION_ORDER[a] - SESSION_ORDER[b]);

        let firstOfYear = true;
        for (const sess of ySessions) {
          const sessData = paper.years[year][sess];
          const cells = [];
          let rowHasVisible = false;
          let rowAllDone = true;
          let rowAnyQp = false;
          let rowSearchText = `${year} ${sess} ${sessData.label}`.toLowerCase();

          for (const v of columns) {
            const files = sessData.variants[v];
            if (!files) {
              cells.push(`<td class="empty-cell">—</td>`);
              continue;
            }
            if (!passesFilter(year, sess, v)) {
              cells.push(`<td class="empty-cell"></td>`);
              continue;
            }
            const qp = files.qp, ms = files.ms;
            if (qp) { paperTotal++; rowAnyQp = true; }
            const checked = qp && progress[qp];
            if (checked) paperDone++;
            if (!checked) rowAllDone = false;
            rowHasVisible = true;
            rowSearchText += " " + (qp || "") + " " + (ms || "");
            cells.push(`
              <td data-qp="${qp || ""}">
                <div class="cell-content">
                  ${qp ? `<a href="${qp}" target="_blank" rel="noopener">QP</a>` : `<a class="missing">QP</a>`}
                  ${ms ? `<a href="${ms}" target="_blank" rel="noopener">MS</a>` : `<a class="missing">MS</a>`}
                  ${qp ? `<input type="checkbox" ${checked ? "checked" : ""} data-file="${qp}">` : ""}
                </div>
              </td>`);
          }

          if (!rowHasVisible) continue;

          const matchesSearch = !searchQ || rowSearchText.includes(searchQ);
          const rowDone = rowAnyQp && rowAllDone;
          const rowHidden = !matchesSearch || (hideDone && rowDone);

          rows.push(`
            <tr class="${rowDone ? "done" : ""} ${firstOfYear && rows.length ? "year-start" : ""} ${rowHidden ? "hidden" : ""}">
              <td class="year-cell left">${firstOfYear ? year : ""}</td>
              <td class="session-cell left">${sessData.label}</td>
              ${cells.join("")}
            </tr>`);
          firstOfYear = false;
        }
      }

      if (!rows.length) continue;
      // Skip paper if all rows hidden
      const visibleRows = rows.filter(r => !r.includes("hidden")).length;
      if (!visibleRows) continue;

      anyPaperShown = true;

      out.push(`
        <div class="paper-card" data-paper="${paperCode}">
          <div class="paper-head">
            <span class="paper-code">${paperCode}</span>
            <span class="paper-label">${paper.label}</span>
            <span class="paper-progress">${paperDone}/${paperTotal}</span>
          </div>
          <table>
            <thead>
              <tr>
                <th class="left">Year</th>
                <th class="left">Session</th>
                ${columns.map(v => `<th>/${String(v).padStart(2, "0")}</th>`).join("")}
              </tr>
            </thead>
            <tbody>${rows.join("")}</tbody>
          </table>
        </div>`);
    }

    if (!anyPaperShown) {
      out.push(`
        <div class="empty">
          No papers match the current filters.<br>
          Try clearing filters or adjusting the search.
        </div>`);
    }

    contentEl.innerHTML = out.join("");
  }

  // --- interactions ---------------------------------------------------------
  contentEl.addEventListener("change", (e) => {
    const cb = e.target;
    if (cb.type !== "checkbox" || !cb.dataset.file) return;
    const file = cb.dataset.file;
    if (cb.checked) progress[file] = true;
    else delete progress[file];
    saveProgress(progress);
    // re-render current content to update row highlighting & paper counters
    renderContent();
    renderTabs();
  });

  const searchEl = document.getElementById("search");
  const hideDoneEl = document.getElementById("hideDone");
  searchEl.addEventListener("input", () => renderContent());
  hideDoneEl.addEventListener("change", () => renderContent());

  // --- export / import / reset ----------------------------------------------
  document.getElementById("exportBtn").onclick = () => {
    const blob = new Blob([JSON.stringify(progress, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `pastpaper-progress-${stamp}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  document.getElementById("importBtn").onclick = () => document.getElementById("fileInput").click();
  document.getElementById("fileInput").onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (typeof data !== "object" || Array.isArray(data)) throw new Error("bad shape");
        progress = { ...progress, ...data };
        saveProgress(progress);
        renderContent();
        renderTabs();
      } catch (err) {
        alert("Could not import: " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };
  document.getElementById("resetBtn").onclick = () => {
    if (!confirm("Clear all progress? This cannot be undone.")) return;
    progress = {};
    saveProgress(progress);
    renderContent();
    renderTabs();
  };

  // --- initial render -------------------------------------------------------
  if (!PAPERS.length) {
    tabsEl.innerHTML = "";
    contentEl.innerHTML = `
      <div class="empty">
        <strong>No paper manifest found.</strong><br>
        Run <code>python download.py</code> in this folder to download papers, then refresh this page.
      </div>`;
  } else {
    renderChips();
    renderTabs();
    renderContent();
  }
})();
</script>
</body>
</html>
